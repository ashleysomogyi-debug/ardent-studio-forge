name: Notify Bing (IndexNow)

# After Vercel finishes a production deploy, tell IndexNow search engines (Bing, etc.)
# that the pages are fresh. Can also be run by hand from the Actions tab.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
